    <div id="root">
      <div style="font-family: 'Poppins', sans-serif; padding: 10vh 20px; text-align: center; background-color: #F3F3E6; color: #1D1912; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;">
